# finn.toml — the manifest the real package manager consumes.
#
# `finn` resolves imports as `-I src` plus the standard library, so every
# module this project imports lives directly in `src/`. An entrypoint is a file
# under `src/`; `main.fin` builds the CLI.
[project]
name = "fin-ssg"
version = "0.2.0"
envpath = ".finn"
entrypoint = "main.fin"

[packages]

[scripts]
check = "finc -I src src/main.fin"
build = "finc -I src src/main.fin -o fin-ssg"
test = "finc -I src tests/markdown_test.fin -o build-test && ./build-test && python3 -I tests/e2e.py --finc finc"
