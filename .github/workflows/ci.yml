name: CI

# The compiler comes from a pinned published release, not from a source build.
#
# This used to clone M1778/Fin and run ./build.sh, which cost twenty minutes per job and
# needed Conan, CMake, Flex, Bison and LLVM 22 on every runner. It also tested whatever the
# compiler's master happened to be at the time, so a red run could not be attributed without
# reading a second repository.
#
# FINC_VERSION pins it; .github/scripts/install_finc.py verifies the archive's sha256 against
# the release index before unpacking. On Linux it takes the static musl build, which needs no
# LLVM runtime on the runner.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must not cancel the others: finding out which platforms are
      # broken is the point.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The released artifact is not self-contained on every platform: the glibc builds need
      # libLLVM.so.22 and the macOS builds name an absolute Homebrew keg. Without it the
      # loader aborts before main and the failure reads as a broken compiler. On Linux and
      # macOS the installer installs the runtime the artifact actually needs; on Windows
      # LLVM is linked in and this does nothing.
      - name: Install the LLVM runtime the artifact needs
        shell: bash
        run: python .github/scripts/install_finc_runtime.py

      - name: Install the pinned finc
        shell: bash
        run: python .github/scripts/install_finc.py --dest "$RUNNER_TEMP/finc"

      - name: Put finc on PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/finc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/finc/bin/finc" --version

      - name: Type-check the entrypoint
        shell: bash
        run: finc -I src/vendor src/main.fin

      # A branch only one platform parses cannot be found wrong by any other lane. Two
      # syntax errors in the Windows branch of platform.fin shipped before this check existed
      # (a hard-keyword parameter, and a hex literal, which Fin has none of), and each cost a
      # ten-minute CI round trip that reported one error at a time.
      #
      # This flips the guards so the other platform's branch becomes the live one, runs the
      # front end here, and restores the file. `@define`d C functions never link and do not
      # need to: a lexical, syntactic or type error is found before code generation.
      - name: Type-check the branch this platform cannot compile
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tests/tools/check_foreign_branches.py --finc finc \
              --file src/vendor/platform.fin --needle FIN_TARGET_LINUX \
              --entry src/main.fin --include src/vendor
          else
            python tests/tools/check_foreign_branches.py --finc finc \
              --file src/vendor/platform.fin --needle FIN_TARGET_WINDOWS \
              --entry src/main.fin --include src/vendor
          fi

      # tests/smoke.py builds the example site and asserts on the emitted files, checks the
      # open-flag mapping, and runs the security, CLI, filesystem and limits regressions. It is
      # invoked through smoke.sh so the invocation lives in one place for local and CI runs.
      #
      # Linux only, because that is what the generator supports. `detect_open_flags` reads
      # `uname` and returns ok:false for anything that is not Linux, and the generator then
      # reports "requires Linux x86_64 or aarch64" and exits 1. On macOS that is the correct
      # answer, not a broken build, so this step asserts the refusal instead of expecting the
      # suite to pass -- a lane that skipped silently would leave the README's platform claim
      # unbacked either way, and a lane that went red would claim a regression that is not one.
      - name: Run the smoke and regression suite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 15
        run: sh tests/smoke.sh

      - name: Assert the documented refusal on this platform (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          finc -I src/vendor src/main.fin -o "$RUNNER_TEMP/fin-ssg"
          set +e
          "$RUNNER_TEMP/fin-ssg" -c example/content -l example/layout -o "$RUNNER_TEMP/site" 2>"$RUNNER_TEMP/err.txt"
          status=$?
          set -e
          cat "$RUNNER_TEMP/err.txt"
          if [ "$status" -eq 0 ]; then
            echo "::error::the generator succeeded on macOS, so detect_open_flags now supports"
            echo "::error::it. Update the README's platform table and run the full suite here."
            exit 1
          fi
          grep -q "requires Linux" "$RUNNER_TEMP/err.txt" || {
            echo "::error::macOS failed for a reason other than the documented refusal"
            exit 1
          }

      - name: Assert the Windows build links and refuses (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          finc -I src/vendor src/main.fin -o "$RUNNER_TEMP/fin-ssg.exe"
          # Building is the claim this lane backs: the Windows branch contains @defines for
          # CreateFileA, MoveFileExA and the rest, and a syntax error in them is invisible on
          # every other platform. Whether the generator then runs is a separate statement,
          # and the README says it does not.
          "$RUNNER_TEMP/fin-ssg.exe" --help > "$RUNNER_TEMP/help.txt" 2>&1 || true
          cat "$RUNNER_TEMP/help.txt"
