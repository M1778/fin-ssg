name: CI

# The compiler comes from a pinned published release, not from a source build.
#
# This used to clone M1778/Fin and run ./build.sh, which cost twenty minutes per job and
# needed Conan, CMake, Flex, Bison and LLVM 22 on every runner. It also tested whatever the
# compiler's master happened to be at the time, so a red run could not be attributed without
# reading a second repository.
#
# FINC_VERSION pins it; .github/scripts/install_finc.py verifies the archive's sha256 against
# the release index before unpacking. On Linux it takes the static musl build, which needs no
# LLVM runtime on the runner.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must not cancel the others: finding out which platforms are
      # broken is the point.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the pinned finc
        shell: bash
        run: python .github/scripts/install_finc.py --dest "$RUNNER_TEMP/finc"

      - name: Put finc on PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/finc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/finc/bin/finc" --version

      - name: Type-check the entrypoint
        shell: bash
        run: finc -I src/vendor src/main.fin

      # tests/smoke.py builds the example site and asserts on the emitted files, checks the
      # open-flag mapping, and runs the security, CLI, filesystem and limits regressions. It is
      # invoked through smoke.sh so the invocation lives in one place for local and CI runs.
      - name: Run the smoke and regression suite
        shell: bash
        timeout-minutes: 15
        run: sh tests/smoke.sh
