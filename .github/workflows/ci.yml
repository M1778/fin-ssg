name: CI

# Three platforms, and every one compiles the generator, runs the library
# tests, builds the example site and asserts on the published files. A lane
# that only type-checked would not be testing this project.
on:
  push:
    branches: [master, main, production/hardening]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A toolchain download plus a full site build is minutes, not tens.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `ldflags` is the value FIN_LDFLAGS takes, and the values differ
        # because finc puts -lLLVM-22 on every POSIX link line and a runner has
        # no LLVM development library; FIN_LDFLAGS replaces that whole list.
        # It is a matrix value rather than an expression because an empty
        # string is falsy in a GitHub expression, so `A && '' || B` yields B.
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            ldflags: "-lm"
          - name: macos-arm64
            os: macos-14
            ldflags: "-lm"
          - name: windows-x86_64
            os: windows-2022
            ldflags: "-llegacy_stdio_definitions"

    steps:
      - uses: actions/checkout@v4

      # The version under test is one file, and the shared installer verifies
      # the archive's sha256 against the published index before unpacking it.
      # On Linux it picks the musl artifact, which is static: the glibc one
      # links libLLVM.so.22.1 and does not start without it.
      # The shared installer ends with `::add-path::`, which the runner now
      # rejects as a disabled command and which fails the step. The PATH is
      # set by the next step through $GITHUB_PATH instead, so the line is
      # filtered out here rather than the shared script being forked.
      - name: Install finc
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/install_finc.py | grep -v '^::add-path::'

      # $GITHUB_PATH takes a native path: a POSIX-form path written from bash
      # is unusable to a native Windows Python, which is what runs the tests.
      - name: Put finc on PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$(cygpath -w "$PWD/.finc/bin")" >> "$GITHUB_PATH"
          else
            echo "$PWD/.finc/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify the installed compiler
        shell: bash
        run: |
          finc --version
          finc --version | grep -q 'contract 3'

      # The header rule is enforced where it can be, not just documented.
      - name: Source headers
        shell: bash
        run: python3 scripts/fin_header.py --repo fin-ssg --license MIT --check src tests scripts

      - name: Frontend check
        shell: bash
        run: finc -I src src/main.fin

      # finc links every program against -lLLVM-22 even when the program uses
      # none of it, and a runner has no LLVM development library. FIN_CC names
      # the driver and FIN_LDFLAGS replaces the default library list, which is
      # the documented way to build where that library is absent. The musl
      # compiler is statically linked, so it needs no LLVM at run time either.
      - name: Build the generator
        shell: bash
        env:
          FIN_LDFLAGS: ${{ matrix.ldflags }}
        run: finc -I src src/main.fin -o fin-ssg${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Library tests
        shell: bash
        env:
          FIN_LDFLAGS: ${{ matrix.ldflags }}
        run: |
          finc -I src tests/markdown_test.fin -o markdown-test${{ runner.os == 'Windows' && '.exe' || '' }}
          ./markdown-test${{ runner.os == 'Windows' && '.exe' || '' }}

      # The suite builds its own copy of the generator and asserts on the
      # published site, so this step is the one that proves the tool works.
      - name: End-to-end site tests
        shell: bash
        env:
          FIN_LDFLAGS: ${{ matrix.ldflags }}
        run: python3 -I tests/e2e.py --finc finc

      # The manifest is part of the product: prove the real package manager
      # can consume it, rather than leaving that claim to a human.
      - name: finn can consume the manifest
        if: runner.os == 'Linux'
        shell: bash
        env:
          FIN_LDFLAGS: ${{ matrix.ldflags }}
        run: |
          cargo install finn --git https://github.com/M1778/finn
          export FIN_COMPILER_PATH="$PWD/.finc/bin/finc"
          finn build
          ./out/fin-ssg --help > /dev/null
          finn test
