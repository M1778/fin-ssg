# finn.toml — REAL format per github.com/M1778/finn (README, 2026-10-19).
# Layout: finn.toml, src/main.fin, src/vendor/*.fin, tests/, .finn/packages/.
[project]
name = "fin-ssg"
version = "0.1.0"
envpath = ".finn"
entrypoint = "main.fin"

# fin-markdown + fin-template are adopted as vendored copies under
# src/vendor/ (fin-markdown v0.1.0 + fin-ssg hardening; fin-template
# v0.1.0 via tpl_render). No [packages] until the finn registry resolves
# bare names; the import spellings already match, so that switch needs
# no code change.

[scripts]
check = "finc -I src/vendor src/main.fin"
build = "finc -I src/vendor src/main.fin -o fin-ssg"
smoke = "sh tests/smoke.sh"
